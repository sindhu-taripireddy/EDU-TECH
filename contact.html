<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contact Us - EduLearn</title>
<style>
    body {
        margin: 0;
        font-family: 'Segoe UI', sans-serif;
        
        background: url('https://png.pngtree.com/thumb_back/fh260/background/20220217/pngtree-businesswoman-using-contact-icon-interface-photo-image_29649620.jpg') 
                    no-repeat center center/cover;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
    }

    header {
        background: rgba(255, 255, 255, 0.7);
        padding: 15px 50px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        backdrop-filter: blur(12px);
        box-shadow: 0 2px 15px rgba(0,0,0,0.1);
    }

    header h1 {
        color: #2c3e50;
        font-size: 24px;
        font-weight: 600;
        margin: 0;
    }

    nav a {
        margin: 0 15px;
        text-decoration: none;
        color: #2c3e50;
        font-weight: 500;
        transition: color 0.3s ease;
    }

    nav a:hover {
        color: #2980b9;
    }

    
    .main-content {
        flex: 1;
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 40px;
    }

    
    .contact-container {
        width: 420px;
        padding: 35px;
        border-radius: 20px;
        background: rgba(255, 255, 255, 0.15);
        backdrop-filter: blur(15px);
        -webkit-backdrop-filter: blur(15px);
        box-shadow: 0 8px 32px rgba(0,0,0,0.25);
        border: 1px solid rgba(255,255,255,0.3);
        color: #fff;
    }

    .contact-container h2 {
        text-align: center;
        color: #fff;
        margin-bottom: 20px;
        font-size: 26px;
        text-shadow: 0 2px 5px rgba(0,0,0,0.3);
    }

    .contact-info {
        text-align: center;
        margin-bottom: 20px;
        font-weight: 500;
    }

    .contact-info p {
        margin: 6px 0;
        font-size: 15px;
        color: #f1f1f1;
    }

    form .form-group {
        margin-bottom: 15px;
    }

    form label {
        display: block;
        font-weight: 500;
        margin-bottom: 6px;
        font-size: 14px;
        color: #f9f9f9;
    }

    form input, form textarea {
        width: 100%;
        padding: 12px;
        border-radius: 12px;
        border: none;
        font-size: 14px;
        outline: none;
        background: rgba(255, 255, 255, 0.2);
        color: #fff;
        box-shadow: inset 0 2px 6px rgba(0,0,0,0.2);
        transition: all 0.3s ease;
    }

    form input:focus, form textarea:focus {
        background: rgba(255,255,255,0.3);
        box-shadow: 0 0 8px rgba(255,255,255,0.6);
    }

    form textarea {
        resize: none;
        height: 100px;
    }

    button {
        background: linear-gradient(135deg, #2980b9, #6dd5fa);
        color: white;
        padding: 12px;
        border: none;
        border-radius: 12px;
        font-size: 16px;
        font-weight: bold;
        cursor: pointer;
        transition: transform 0.2s ease, box-shadow 0.3s ease;
        width: 100%;
    }

    button:hover {
        transform: translateY(-2px);
        box-shadow: 0 6px 15px rgba(0,0,0,0.3);
    }
</style>
</head>
<body>

<header>
    <h1>EduTech</h1>
    <nav>
        <a href="index.html">Home</a>
        <a href="videos.html">Videos</a>
        <a href="quizzes.html">Quizzes</a>
        <a href="about.html">About</a>
        <a href="contact.html">Contact</a>
    </nav>
</header>

<div class="main-content">
    <div class="contact-container">
        <h2>Contact Us</h2>
        <div class="contact-info">
            <p>Email: support@eduTech.com</p>
            <p>Phone: +91 9876543210</p>
            <p>Address: Hyderabad, India</p>
        </div>

        <form>
            <div class="form-group">
                <label for="name">Your Name</label>
                <input type="text" id="name" placeholder="Enter your name" required>
            </div>

            <div class="form-group">
                <label for="email">Your Email</label>
                <input type="email" id="email" placeholder="Enter your email" required>
            </div>

            <div class="form-group">
                <label for="message">Your Message</label>
                <textarea id="message" placeholder="Write your message here..." required></textarea>
            </div>

            <button type="submit">Send Message</button>
        </form>
    </div>
</div>

</body>
</html>
